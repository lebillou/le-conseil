name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests du moteur
        run: node tools/check.js
      - name: index.html à jour
        run: |
          python3 build.py
          git diff --exit-code -- index.html || (echo "index.html n'est pas à jour : lancer python3 build.py" && exit 1)
