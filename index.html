<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Conseil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Archivo:wdth,wght@75..110,300..800&display=swap" rel="stylesheet">
<style>
/* Plan : papier-valeur vert-de-gris, encre sombre, vermillon du tampon pour le joueur.
   Disposition : en-tête « titre au porteur », onglets de dossier, cartes de décision empilées, pied de séance collant. */
:root {
  --paper: #ECEFE8;
  --surface: #F7F8F4;
  --ink: #16221C;
  --muted: #5B6A61;
  --line: #CBD3C9;
  --accent: #C23F28;
  --brass: #8C6E22;
  --good: #2C7A4B;
  --bad: #B3261E;
  --warn: #9C620C;
  --tint: #E2E7DF;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1512; --surface: #16201B; --ink: #E3E9E2; --muted: #98A69D; --line: #2B3932;
    --accent: #EA6A50; --brass: #CDAA5C; --good: #5CBB84; --bad: #F06B5F; --warn: #E2A644; --tint: #1D2923;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1512; --surface: #16201B; --ink: #E3E9E2; --muted: #98A69D; --line: #2B3932;
  --accent: #EA6A50; --brass: #CDAA5C; --good: #5CBB84; --bad: #F06B5F; --warn: #E2A644; --tint: #1D2923;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: 0.005em; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.eyebrow { font-stretch: 85%; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.72rem; font-weight: 600; color: var(--muted); }

/* ---------- En-tête certificat ---------- */
.cert {
  position: relative; overflow: hidden; border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.cert canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.55; pointer-events: none; }
.cert .wrap { position: relative; padding-top: 28px; padding-bottom: 26px; }
.cert .frame { border: 1px solid var(--brass); outline: 1px solid var(--brass); outline-offset: 3px; padding: 22px 20px 20px; background: color-mix(in srgb, var(--surface) 82%, transparent); }
.brand { font-family: var(--display); font-weight: 700; font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: 0.95; letter-spacing: 0.04em; font-variation-settings: "opsz" 96; }
.brand em { font-style: italic; font-weight: 500; color: var(--accent); }
.cert .lede { max-width: 62ch; margin-top: 12px; font-size: 1.02rem; }
.cert .serial { font-stretch: 80%; letter-spacing: 0.2em; font-size: 0.72rem; color: var(--brass); text-transform: uppercase; display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }

/* ---------- Accueil ---------- */
.home { display: grid; gap: 26px; padding: 26px 0 60px; }
.scen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.scen {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px 16px 14px; display: grid; gap: 8px; cursor: pointer; position: relative;
}
.scen:hover { border-color: var(--muted); }
.scen[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.scen[aria-pressed="true"]::after { content: "Retenu"; position: absolute; top: 12px; right: 12px; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 700; border: 1.5px solid var(--accent); padding: 1px 6px; transform: rotate(4deg); }
.scen h3 { font-size: 1.2rem; padding-right: 64px; }
.scen .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; align-items: end; }
.field { display: grid; gap: 4px; }
.field label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
input[type="number"], input[type="text"], select {
  background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-height: 40px; width: 100%;
}
input[type="number"]:focus, input[type="text"]:focus, select:focus { border-color: var(--ink); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.btn {
  border: 1px solid var(--ink); background: transparent; border-radius: 4px; padding: 9px 16px; cursor: pointer; font-weight: 600; min-height: 40px;
}
.btn:hover { background: var(--tint); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { background: color-mix(in srgb, var(--ink) 85%, var(--accent)); }
.btn.seal { background: var(--accent); border-color: var(--accent); color: #fff; letter-spacing: 0.02em; }
.btn.seal:hover { filter: brightness(1.06); }
.btn.ghost { border-color: var(--line); font-weight: 500; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chip { font-size: 0.74rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); white-space: nowrap; }
.chip.on { border-color: var(--ink); color: var(--ink); }

/* ---------- Barre de jeu ---------- */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.topbar .wrap { display: grid; gap: 8px; padding-top: 10px; padding-bottom: 0; }
.topline { display: flex; align-items: baseline; gap: 10px 16px; flex-wrap: wrap; justify-content: space-between; }
.mini-brand { font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: 0.05em; }
.mini-brand em { color: var(--accent); font-weight: 500; }
.exercise { font-family: var(--display); font-size: 1.05rem; }
.exercise b { font-weight: 700; }
.kpis { display: flex; gap: 4px 18px; flex-wrap: wrap; font-size: 0.84rem; }
.kpis span b { font-weight: 700; margin-left: 4px; }
.timer { font-weight: 700; color: var(--accent); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 4px -16px 0; padding: 0 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 1px solid transparent; border-bottom: none; background: none; padding: 8px 12px 9px; cursor: pointer; white-space: nowrap;
  border-radius: 6px 6px 0 0; color: var(--muted); font-weight: 600; font-size: 0.88rem;
}
.tab[aria-selected="true"] { background: var(--paper); border-color: var(--line); color: var(--ink); position: relative; top: 1px; }
main { padding: 18px 0 120px; }
.section { display: grid; gap: 12px; margin-bottom: 26px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }

/* ---------- Ordre du jour ---------- */
.news { display: grid; gap: 8px; }
.news-item { border-left: 3px solid var(--brass); padding: 8px 12px; background: var(--surface); border-radius: 0 var(--r) var(--r) 0; }
.news-item .eyebrow { color: var(--brass); }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 10px 12px; display: grid; gap: 2px; }
.stat .v { font-size: 1.15rem; font-weight: 700; }
.stat .k { font-size: 0.74rem; color: var(--muted); }

/* ---------- Cartes de division ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.seg-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 14px; display: grid; gap: 10px; border-top: 4px solid var(--qcol, var(--line)); }
.seg-card.q-vedette { --qcol: var(--good); }
.seg-card.q-vache { --qcol: var(--brass); }
.seg-card.q-dilemme { --qcol: #3E78A8; }
.seg-card.q-poids { --qcol: var(--bad); }
.seg-card.selling { background: repeating-linear-gradient(-45deg, var(--surface) 0 10px, var(--tint) 10px 20px); }
.seg-card header { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.qpill { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 3px; color: #fff; background: var(--qcol); white-space: nowrap; }
.q-vache .qpill { color: #fff; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; margin: 0; }
.facts div { display: grid; }
.facts dt { font-size: 0.7rem; color: var(--muted); }
.facts dd { margin: 0; font-weight: 650; font-size: 0.95rem; }
.inv { display: grid; gap: 6px; }
.inv-line { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; }
.inv-line label { font-size: 0.82rem; font-weight: 600; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: var(--paper); border-radius: 3px; padding: 4px 8px; font-size: 0.78rem; cursor: pointer; min-height: 32px; }
.quick button:hover { border-color: var(--ink); }
.quick button.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.dv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.effect { font-size: 0.8rem; color: var(--muted); }
.entry-list { display: grid; gap: 8px; }
.entry { display: grid; grid-template-columns: 1fr 120px; gap: 6px 10px; align-items: center; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 12px; }
.entry .meta { font-size: 0.8rem; color: var(--muted); }

/* ---------- Financement ---------- */
.fin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.fin-grid .panel { display: grid; gap: 10px; align-content: start; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 0.86rem; }
.kv span:first-child { color: var(--muted); }
.slider-head { display: flex; justify-content: space-between; align-items: baseline; }
.slider-head b { font-size: 1.1rem; }

/* ---------- Pied de séance ---------- */
.footer-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 25; box-shadow: 0 -6px 18px rgb(0 0 0 / 0.06); }
.footer-bar .wrap { display: flex; gap: 10px 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
.footer-bar .sum { display: flex; gap: 2px 16px; flex-wrap: wrap; font-size: 0.85rem; }
.footer-bar .sum b { font-weight: 700; }
.sig { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 0; background: var(--good); }
.sig.warn { background: var(--warn); } .sig.bad { background: var(--bad); }

/* ---------- Tables ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
thead th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 650; background: var(--surface); }
tbody tr:last-child td { border-bottom: none; }
tr.me td { font-weight: 700; }
tr.me td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tr.dead td { color: var(--muted); text-decoration: line-through; }
td.sub, th.sub { padding-left: 22px; color: var(--muted); font-weight: 400; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; vertical-align: 0; }

/* ---------- Marchés ---------- */
.mk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.mk { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; }
.sharebar { display: flex; height: 22px; border-radius: 3px; overflow: hidden; background: var(--tint); }
.sharebar span { display: block; height: 100%; min-width: 2px; border-right: 1px solid var(--surface); }
.legend { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 0.78rem; }
svg text { font-family: var(--body); fill: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.sd-flag { font-size: 0.72rem; font-weight: 700; padding: 1px 6px; border-radius: 3px; }
.sd-over { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.sd-under { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.sd-eq { background: var(--tint); color: var(--muted); }

/* ---------- Matrice ---------- */
.matrix-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.co-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.co-pick button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 0.82rem; min-height: 32px; }
.co-pick button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }

/* ---------- Feuille de résultats ---------- */
.sheet-back { position: fixed; inset: 0; background: rgb(10 16 13 / 0.55); z-index: 50; display: grid; place-items: end center; padding: 0; }
@media (min-width: 700px) { .sheet-back { place-items: center; padding: 20px; } }
.sheet { background: var(--surface); width: 100%; max-width: 720px; max-height: 92vh; overflow: auto; border-radius: 12px 12px 0 0; padding: 22px 18px calc(20px + env(safe-area-inset-bottom)); position: relative; display: grid; gap: 16px; }
@media (min-width: 700px) { .sheet { border-radius: 10px; } }
.stamp {
  position: absolute; top: 18px; right: 16px; border: 3px solid var(--accent); color: var(--accent); font-family: var(--display); font-weight: 800;
  font-size: 0.92rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 10px; transform: rotate(-8deg); border-radius: 4px; line-height: 1.1; text-align: center;
  mix-blend-mode: multiply; opacity: 0.9;
}
:root[data-theme="dark"] .stamp { mix-blend-mode: normal; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp { mix-blend-mode: normal; } }
.stamp.fx { animation: stamp 0.42s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes stamp { 0% { transform: rotate(-8deg) scale(2.4); opacity: 0; } 70% { opacity: 1; } 100% { transform: rotate(-8deg) scale(1); opacity: 0.9; } }
@media (prefers-reduced-motion: reduce) { .stamp.fx { animation: none; } }
.big-score { font-family: var(--display); font-size: 2.6rem; font-weight: 700; line-height: 1; }
.delta { font-weight: 700; }
.notes { display: grid; gap: 6px; margin: 0; padding-left: 18px; font-size: 0.88rem; }
.rank-list { display: grid; gap: 4px; }
.rank-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; font-size: 0.9rem; padding: 4px 0; border-bottom: 1px solid var(--line); }
.rank-row.me { font-weight: 700; }
.rank-row:last-child { border-bottom: none; }

/* ---------- Journal et règles ---------- */
.log { display: grid; gap: 14px; }
.log-year h3 { font-size: 1rem; margin-bottom: 6px; }
.log-year ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 0.88rem; }
.rules { display: grid; gap: 16px; max-width: 72ch; }
.rules h3 { margin-top: 6px; }
.rules p, .rules li { font-size: 0.94rem; }
.rules ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.formula { font-family: var(--display); font-style: italic; font-size: 1.05rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; }

/* ---------- Fin de partie ---------- */
.podium { display: grid; gap: 16px; }
.verdict { font-family: var(--display); font-size: clamp(1.6rem, 5vw, 2.4rem); line-height: 1.15; }

@media (max-width: 520px) {
  body { font-size: 14.5px; }
  .footer-bar .wrap { gap: 6px; padding-top: 8px; }
  .footer-bar .sum { font-size: 0.78rem; gap: 0 12px; }
  .footer-bar .sum .muted { display: none; }
  .footer-bar .row { width: 100%; flex-wrap: nowrap; }
  .footer-bar .row .btn { flex: 1 1 auto; padding: 8px 10px; }
  .facts { grid-template-columns: repeat(3, 1fr); }
  .inv-line, .entry { grid-template-columns: 1fr 104px; }
  .cards, .mk-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<div id="app"></div>
<script>
"use strict";
/* ============================================================
   LE CONSEIL — moteur de simulation (pur, sérialisable JSON)
   ============================================================ */
var ENGINE = (function () {

  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);

  /* ---------- Aléa reproductible (mulberry32, état dans G) ---------- */
  function rnd(G) {
    let a = (G.rng = (G.rng + 0x6D2B79F5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function gauss(G) {
    let u = 0;
    while (u === 0) u = rnd(G);
    const v = rnd(G);
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function pick(G, arr) { return arr[Math.floor(rnd(G) * arr.length) % arr.length]; }

  function pathGrowth(path, t) {
    if (t <= path[0][0]) return path[0][1];
    for (let i = 1; i < path.length; i++) {
      if (t <= path[i][0]) {
        const [t0, g0] = path[i - 1], [t1, g1] = path[i];
        return g0 + (g1 - g0) * (t - t0) / (t1 - t0);
      }
    }
    return path[path.length - 1][1];
  }

  /* ---------- Profils des concurrents pilotés par l'IA ---------- */
  const PERSONAS = {
    gardien: {
      label: "Gardien du métier",
      desc: "Défend ses positions de leader, investit au rythme du marché, distribue régulièrement.",
      payout: 0.40, aggr: 0.25, push: 0.25, harvestG: 0.0, harvestRS: 0.5, util: 0.97,
      debt: true, equity: false, entry: 0.06, entryShare: 0.08, odUse: 0.15, exitPatience: 3,
      buyback: true, flexDiv: true, loanYears: 6
    },
    conquerant: {
      label: "Conquérant",
      desc: "Cherche la part de marché dans les créneaux en croissance, finance par dette et augmentations de capital.",
      payout: 0.12, aggr: 1.0, push: 0.55, harvestG: -0.02, harvestRS: 0.35, util: 0.95,
      debt: true, equity: true, entry: 0.30, entryShare: 0.12, odUse: 0.45, exitPatience: 4,
      buyback: false, flexDiv: true, loanYears: 8
    },
    rentier: {
      label: "Rentier",
      desc: "Privilégie le dividende, investit peu, se retire vite des activités déficitaires.",
      payout: 0.70, aggr: 0.0, push: 0.05, harvestG: 0.03, harvestRS: 0.9, util: 0.99,
      debt: false, equity: false, entry: 0.0, entryShare: 0.05, odUse: 0.05, exitPatience: 2,
      buyback: true, flexDiv: false, loanYears: 5
    },
    diversifieur: {
      label: "Diversifieur",
      desc: "Multiplie les entrées dans les créneaux nouveaux, au risque de la dispersion.",
      payout: 0.30, aggr: 0.55, push: 0.3, harvestG: 0.0, harvestRS: 0.5, util: 0.96,
      debt: true, equity: false, entry: 0.45, entryShare: 0.10, odUse: 0.15, exitPatience: 3,
      buyback: false, flexDiv: true, loanYears: 7
    },
    opportuniste: {
      label: "Opportuniste",
      desc: "Achète les divisions mises en vente, coupe vite ce qui ne rapporte pas.",
      payout: 0.30, aggr: 0.6, push: 0.4, harvestG: 0.01, harvestRS: 0.6, util: 0.96,
      debt: true, equity: false, entry: 0.15, entryShare: 0.08, odUse: 0.25, exitPatience: 2,
      buyback: false, flexDiv: true, loanYears: 6, bidBoost: 0.2
    }
  };

  /* ---------- Scénarios (sociétés et chiffres fictifs) ---------- */
  const SCENARIOS = [
    {
      id: "industrie",

  const scenarioById = id => SCENARIOS.find(s => s.id === id);
  const segById = (G, id) => G.segments.find(s => s.id === id);
  const coById = (G, id) => G.companies.find(c => c.id === id);
  const lastH = co => co.hist[co.hist.length - 1];

  /* ---------- Paramètres par défaut du « banquier central » ---------- */
  const DEFAULT_PARAMS = {
    tax: 0.25, rate: 0.03, maxDE: 1.5, ebitdaMult: 3, maxLoanYears: 8,
    maxDil: 0.20, maxBuyback: 0.10, cap: 0.55, recov: 0.40, issueDisc: 0.10,
    bcgG: 0.05, overdraft: 0.12, odPremium: 0.04
  };

  /* ---------- Économie d'un créneau ---------- */
  function effX(G, co, seg) {
    const d = co.div[seg.id];
    let x = d.X / seg.Xnorm;
    for (const sid in co.div) {
      if (sid === seg.id) continue;
      const s2 = segById(G, sid);
      if (s2.group === seg.group) x += 0.25 * co.div[sid].X / s2.Xnorm;
    }
    return Math.max(0.05, x);
  }

  function unitCost(G, co, seg) {
    return seg.cbase * (G.mods.c[seg.id] || 1) * Math.pow(effX(G, co, seg), Math.log2(seg.slope));
  }

  function runMarket(G, seg, t) {
    const players = G.companies.filter(c => c.alive && c.div[seg.id]);
    const S = sum(players, c => c.div[seg.id].K);
    const u = S > 0 ? Math.min(1, seg.D / S) : 0;
    let qT = 0, cq = 0;
    players.forEach(co => {
      const d = co.div[seg.id];
      d.q = d.K * u;
      d.c = unitCost(G, co, seg);
      qT += d.q; cq += d.q * d.c;
    });
    const avgC = qT > 0 ? cq / qT : seg.cbase;
    const r = seg.D > 0 ? S / seg.D : 1;
    const f = clamp(Math.pow(Math.max(r, 0.01), -seg.eps), 0.5, 1.45);
    const P = (avgC + seg.dep * seg.capex) * (1 + seg.mu) * f;
    players.forEach(co => {
      const d = co.div[seg.id];
      d.share = qT > 0 ? d.q / qT : 0;
      d.rev = P * d.q;
      d.opex = d.c * d.q;
      d.ebit = d.rev - d.opex - d.depT;
    });
    players.forEach(co => {
      const d = co.div[seg.id];
      let m = 0;
      players.forEach(o => { if (o !== co) m = Math.max(m, o.div[seg.id].share); });
      d.rs = m > 0 ? clamp(d.share / m, 0.01, 10) : 10;
    });
    seg.P = P; seg.S = S; seg.r = r; seg.u = u;
    seg.hist.push({ t, D: seg.D, g: seg.g, P, r, u, S, n: players.length });
  }

  function segPER(seg) {
    const h = seg.hist;
    const n = Math.min(3, h.length);
    let g = 0;
    for (let i = h.length - n; i < h.length; i++) g += h[i].g;
    g = n ? g / n : 0;
    return clamp(11 + 280 * g, 10, 45) + (seg.perBonus || 0);
  }

  function forecastGrowth(G, seg, t) {
    return pathGrowth(seg.path, t) + seg.gShift + (G.mods.g[seg.id] || 0);
  }

  /* ---------- Banque ---------- */
  function maxLoan(G, co) {
    if (co.loan || co.pendingLoan) return 0;
    const h = lastH(co), p = G.params;
    const ebitda = h.ebit + h.dep;
    const eq = Math.max(0, h.equity);
    return Math.max(0, Math.min(p.ebitdaMult * ebitda, p.maxDE * eq));
  }
  function loanRate(G, co, amt) {
    const h = lastH(co);
    const debt = co.loan ? co.loan.out : 0;
    return G.params.rate + 0.015 + 0.02 * clamp((debt + amt) / Math.max(1, h.equity), 0, 2);
  }
  function loanTotal(P, rate, n) { return P + rate * P * (n + 1) / 2; }

  /* ---------- Valorisation ---------- */
  function valuation(G, co, npRec) {
    let rev = 0, w = 0, assets = 0;
    for (const sid in co.div) {
      const d = co.div[sid], seg = segById(G, sid);
      rev += d.rev || 0; w += (d.rev || 0) * segPER(seg); assets += d.A;
    }
    const PER = rev > 0 ? w / rev : 10;
    const debt = co.loan ? co.loan.out : 0;
    const equity = assets + co.cash - debt;
    const value = Math.max(PER * npRec, 0.5 * Math.max(0, equity));
    return { PER, equity, value, assets, debt };
  }

  /* ---------- Création d'une partie ---------- */
  function newGame(scId, opts) {
    opts = opts || {};
    const sc = scenarioById(scId);
    const seed = (opts.seed >>> 0) || ((Date.now() ^ 0x5bd1e995) >>> 0);
    const G = {
      v: 1, sc: sc.id, title: sc.title, seed, rng: seed | 0,
      year: 0, T: opts.years || 15, startYear: sc.startYear || 2027,
      params: Object.assign({}, DEFAULT_PARAMS, sc.params || {}),
      segments: [], companies: [], listings: [], log: [], news: [],
      mods: { g: {}, c: {} }, over: false, bankrupt: false, nextListingId: 1, results: []
    };
    G.params.rate0 = G.params.rate;
    G.params.ai = { facile: 0.6, normal: 1, difficile: 1.3 }[opts.level || "normal"] || 1;
    G.level = opts.level || "normal";
    G.pinv = [];
    sc.segments.forEach(s => {
      const H = s.H || 8;
      G.segments.push({
        id: s.id, name: s.name, group: s.group || s.id, D: s.D0, D0: s.D0, path: s.path,
        capex: s.capex, cbase: s.cbase || 0.62, slope: s.slope, mu: s.mu, eps: s.eps, dep: s.dep,
        vol: s.vol || 0.012, entryX: s.entryX || 0.35, perBonus: s.perBonus || 0,
        Xnorm: 0.25 * s.D0 * H, gShift: 0, g: pathGrowth(s.path, 0), hist: []
      });
    });
    sc.companies.forEach(c => {
      G.companies.push({
        id: c.id, name: (c.player && opts.playerName) ? opts.playerName : c.name, color: c.color,
        player: !!c.player, persona: c.persona || null, alive: true, cash: 0, shares: 0,
        loan: null, pendingLoan: null, payout: c.payout != null ? c.payout : 0.3,
        div: {}, hist: [], dps: [], overdraft: 0, bankrupt: 0
      });
    });
    sc.segments.forEach(s => {
      const tot = sum(Object.values(s.pos));
      const H = s.H || 8;
      for (const cid in s.pos) {
        const share = s.pos[cid] / tot;
        const K = share * s.D0 / 0.97;
        const co = coById(G, cid);
        co.div[s.id] = {
          K, A: K * s.capex, X: share * s.D0 * H, share, rs: 1, lossYears: 0, unsold: 0,
          depT: s.dep * K * s.capex, inv: s.dep * K * s.capex, entered: -10, hist: []
        };
      }
    });
    G.segments.forEach(seg => runMarket(G, seg, 0));
    G.companies.forEach(co => {
      const c0 = sc.companies.find(c => c.id === co.id);
      let rev = 0, ebit = 0, dep = 0;
      for (const sid in co.div) {
        const d = co.div[sid];
        rev += d.rev; ebit += d.ebit; dep += d.depT;
        d.hist.push(divSnap(d, segById(G, sid), 0));
      }
      co.cash = (c0.cash || 0.08) * rev;
      co.overdraft = G.params.overdraft * rev;
      if (c0.debt) {
        const P = c0.debt * rev, n = c0.debtYears || 6;
        co.loan = { P0: P, out: P, rate: G.params.rate + 0.02, years: n, left: n, ann: P / n };
      }
      const interest = co.loan ? co.loan.out * co.loan.rate : 0;
      const intInc = Math.max(0, co.cash) * Math.max(0, G.params.rate - 0.01);
      const ebt = ebit - interest + intInc;
      const tax = Math.max(0, ebt) * G.params.tax;
      const npRec = ebt - tax;
      const val = valuation(G, co, npRec);
      co.shares = Math.max(1, val.value / 10);
      co.hist.push({
        t: 0, rev, ebit, dep, interest, intInc, tax, npRec, exc: 0, np: npRec, dividends: 0, inv: dep,
        cash: co.cash, debt: val.debt, equity: val.equity, assets: val.assets, value: val.value, PER: val.PER,
        price: val.value / co.shares, dps: 0, score: val.value / co.shares, shares: co.shares,
        issue: 0, buyback: 0, ma: 0, payout: co.payout
      });
    });
    genNews(G, 1);
    return G;
  }

  function divSnap(d, seg, t) {
    return { t, K: d.K, q: d.q, share: d.share, rs: d.rs, rev: d.rev, ebit: d.ebit, c: d.c, inv: d.inv || 0, A: d.A, P: seg.P, u: seg.u, dep: d.depT };
  }

  /* ---------- Actualités / événements ---------- */
  function applyEvent(G, ev) {
    if (ev.g) for (const k in ev.g) {
      if (k === "*") G.segments.forEach(s => { G.mods.g[s.id] = (G.mods.g[s.id] || 0) + ev.g[k]; });
      else G.mods.g[k] = (G.mods.g[k] || 0) + ev.g[k];
    }
    if (ev.cost) for (const k in ev.cost) {
      if (k === "*") G.segments.forEach(s => { G.mods.c[s.id] = (G.mods.c[s.id] || 1) * ev.cost[k]; });
      else G.mods.c[k] = (G.mods.c[k] || 1) * ev.cost[k];
    }
    if (ev.gShift) for (const k in ev.gShift) { const s = segById(G, k); if (s) s.gShift += ev.gShift[k]; }
    if (ev.rate) G.params.rate = clamp(G.params.rate + ev.rate, 0.005, 0.09);
    if (ev.cap) G.params.cap = clamp(G.params.cap + ev.cap, 0.40, 0.80);
  }

  function genNews(G, t) {
    G.mods = { g: {}, c: {} };
    G.news = [];
    const sc = scenarioById(G.sc);
    (sc.scripted || []).filter(e => e.t === t).forEach(e => {
      const ev = Object.assign({ kind: "secteur" }, e);
      applyEvent(G, ev); G.news.push({ t, kind: ev.kind, text: ev.text });
    });
    if (t >= 2 && rnd(G) < 0.45) {
      const segs = G.segments;
      const s = pick(G, segs);
      const pool = [
        () => ({ kind: "conjoncture", text: "Récession : la demande recule dans tous les créneaux cette année (−4 points de croissance).", g: { "*": -0.04 } }),
        () => ({ kind: "conjoncture", text: "Reprise vigoureuse : la demande accélère partout cette année (+3 points de croissance).", g: { "*": 0.03 } }),
        () => ({ kind: "coûts", text: "Choc sur les matières premières : coûts d'exploitation +10 % dans tous les créneaux cette année.", cost: { "*": 1.10 } }),
        () => ({ kind: "banque", text: "La banque centrale relève son taux directeur de 1,5 point. Les nouveaux emprunts coûteront plus cher.", rate: 0.015 }),
        () => ({ kind: "banque", text: "La banque centrale abaisse son taux directeur d'un point.", rate: -0.01 }),
        () => ({ kind: "technologie", text: "Rupture technologique dans « " + s.name + " » : la croissance tendancielle du créneau perd 4 points, durablement.", gShift: { [s.id]: -0.04 } }),
        () => ({ kind: "marché", text: "Nouveaux usages dans « " + s.name + " » : +6 points de croissance cette année, +1 point durablement.", g: { [s.id]: 0.06 }, gShift: { [s.id]: 0.01 } }),
        () => ({ kind: "régulation", text: "L'autorité de la concurrence durcit sa doctrine : le seuil de position dominante baisse de 5 points.", cap: -0.05 })
      ];
      const ev = pick(G, pool)();
      applyEvent(G, ev);
      G.news.push({ t, kind: ev.kind, text: ev.text });
    }
    if (G.params.rate !== G.params.rate0 && !G.news.some(n => n.kind === "banque")) {
      // rien : le taux courant est affiché dans le panneau de financement
    }
    G.news.forEach(n => G.log.push(n));
  }

  /* ---------- Décision par défaut du joueur ---------- */
  function defaultDecision(G, co) {
    const dec = { invest: {}, disinvest: {}, divest: {}, payout: co.payout, loan: null, issuePct: 0, buybackPct: 0, bids: {} };
    for (const sid in co.div) {
      const seg = segById(G, sid), d = co.div[sid];
      dec.invest[sid] = Math.round(seg.dep * d.A);
    }
    return dec;
  }

  /* ---------- Repères d'investissement pour le joueur ---------- */
  function investHints(G, co, sid) {
    const seg = segById(G, sid), d = co.div[sid], t = G.year + 1;
    const gF = forecastGrowth(G, seg, t);
    const Dn = seg.D * (1 + gF);
    if (!d) {
      const entry = 0.08 * Dn / 0.97 * seg.capex;
      return { maint: 0, follow: 0, plus5: Math.round(0.05 * Dn / 0.97 * seg.capex), entry: Math.round(entry), gF };
    }
    const Kafter = d.A * (1 - seg.dep) / seg.capex;
    const need = s => Math.max(0, Math.round((s * Dn / 0.97 - Kafter) * seg.capex));
    return { maint: Math.round(seg.dep * d.A), follow: need(d.share), plus5: need(d.share + 0.05), gF };
  }

  /* ---------- IA des concurrents ---------- */
  function aiDecide(G, co) {
    const p = G.params, t = G.year + 1, k = p.ai || 1;
    const P = Object.assign({}, PERSONAS[co.persona]);
    P.aggr *= k; P.push *= k; P.entry = Math.min(0.9, P.entry * k); P.odUse *= k;
    const h = lastH(co);
    const dec = { invest: {}, disinvest: {}, divest: {}, payout: P.payout, loan: null, issuePct: 0, buybackPct: 0, bids: {} };
    if (co.cash < 0) dec.payout = 0;
    const safety = 0.03 * h.rev;
    let free = co.cash - safety + P.odUse * co.overdraft;

    // enchères sur les divisions à vendre
    G.listings.forEach(L => {
      if (L.seller === co.id) return;
      const seller = coById(G, L.seller);
      if (!seller.alive) return;
      const ld = seller.div[L.seg];
      if (!ld) return;
      const seg = segById(G, L.seg);
      const own = co.div[L.seg];
      if ((own ? own.share : 0) + ld.share > p.cap - 0.01) return;
      const gF = forecastGrowth(G, seg, t);
      const interest = own ? 1 : ((gF > 0.04 && P.entry > 0) ? 0.6 : (P.bidBoost ? 0.4 : 0));
      if (!interest) return;
      const val = ld.A * (0.45 + 0.25 * interest + clamp(gF * 3, -0.15, 0.3) + (P.bidBoost || 0)) * (0.9 + 0.2 * rnd(G));
      const amt = Math.min(val, Math.max(0, co.cash - safety) * 0.6);
      if (amt > 0 && amt >= L.minPrice) { dec.bids[L.id] = Math.round(amt); free -= amt; }
    });

    const cf = (h.npRec > 0 ? h.npRec * (1 - dec.payout) : h.npRec) + h.dep - (co.loan ? co.loan.ann : 0);
    let budget = free + cf;

    const wants = [];
    for (const sid in co.div) {
      const d = co.div[sid], seg = segById(G, sid);
      if (G.listings.some(l => l.seller === co.id && l.seg === sid)) continue;
      const gF = 0.5 * seg.g + 0.5 * forecastGrowth(G, seg, t);
      if (d.lossYears >= P.exitPatience && d.rs < 0.7 && gF < 0.06 && t - d.entered > 4) {
        if (d.unsold >= 1) dec.disinvest[sid] = Math.round(d.A);
        else dec.divest[sid] = { mode: "auction", min: Math.round(0.45 * d.A) };
        continue;
      }
      let mult;
      if (d.rs >= 1) mult = 1 + P.push * clamp(gF * 4, 0, 0.5);
      else mult = 1 + P.aggr * clamp(gF * 5, -0.3, 0.8);
      if (seg.r < 0.93) mult += 0.15 + 0.5 * (0.93 - seg.r);
      else if (seg.r > 1.12 && d.rs < 1) mult = Math.min(mult, 1);
      if (gF < P.harvestG && d.rs < P.harvestRS) {
        mult = Math.min(mult, 0.85);
        if (d.lossYears >= 1 && d.rs < 0.5) { dec.disinvest[sid] = Math.round(0.25 * d.A); continue; }
      }
      let target = d.share * mult;
      if (t - d.entered < 4) target = Math.max(target, P.entryShare);
      target = Math.min(target, Math.max(d.share, p.cap - 0.02));
      const Kreq = target * seg.D * (1 + gF) / P.util;
      const Kafter = d.A * (1 - seg.dep) / seg.capex;
      let inv = Math.max(0, (Kreq - Kafter) * seg.capex);
      if (d.share >= p.cap) inv = Math.min(inv, seg.dep * d.A);
      const maint = Math.min(inv, seg.dep * d.A);
      wants.push({ sid, inv: maint, pr: 3 });
      if (inv > maint) wants.push({ sid, inv: inv - maint, pr: d.rs >= 1 ? 2 : 1 });
    }
    if (P.entry > 0 && t >= 2 && rnd(G) < P.entry) {
      const cands = G.segments.filter(s => !co.div[s.id] && forecastGrowth(G, s, t) > 0.05);
      if (cands.length) {
        cands.sort((a, b) => forecastGrowth(G, b, t) - forecastGrowth(G, a, t));
        const s = cands[0];
        const inv = P.entryShare * s.D * (1 + forecastGrowth(G, s, t)) / P.util * s.capex;
        if (inv < 0.6 * Math.max(0, budget) + 0.3 * h.rev) wants.push({ sid: s.id, inv, pr: 1.5 });
      }
    }
    const total = sum(wants, w => w.inv);
    if (total > budget) {
      const gap = total - budget;
      if (P.debt && !co.loan && !co.pendingLoan) {
        const amt = Math.min(maxLoan(G, co), gap * 1.5 + 0.1 * h.rev);
        if (amt > 0.02 * h.rev) dec.loan = { amount: Math.round(amt), years: P.loanYears };
      }
      if (P.equity && gap > 0.08 * h.rev && h.price > 1) {
        const pct = Math.min(p.maxDil, gap / (co.shares * h.price * (1 - p.issueDisc)));
        if (pct > 0.03) { dec.issuePct = pct; budget += co.shares * pct * h.price * (1 - p.issueDisc); }
      }
      if (P.flexDiv && dec.payout > 0 && h.npRec > 0) {
        budget += 0.5 * dec.payout * h.npRec; dec.payout *= 0.5;
      }
    }
    let rem = Math.max(0, budget);
    [3, 2, 1.5, 1].forEach(pr => {
      const grp = wants.filter(w => w.pr === pr);
      const need = sum(grp, w => w.inv);
      const k = need > 0 ? Math.min(1, rem / need) : 0;
      grp.forEach(w => { dec.invest[w.sid] = (dec.invest[w.sid] || 0) + Math.round(w.inv * k); });
      rem -= need * k;
    });
    if (P.buyback && !co.loan && co.cash > total + 0.25 * h.rev && h.price > 0) dec.buybackPct = Math.min(p.maxBuyback, 0.03);
    return dec;
  }

  /* ---------- Nettoyage de la décision du joueur ---------- */
  function sanitize(G, co, dec) {
    dec = dec || {};
    const out = { invest: {}, disinvest: {}, divest: {}, payout: clamp(+dec.payout || 0, 0, 1), loan: null, issuePct: clamp(+dec.issuePct || 0, 0, G.params.maxDil), buybackPct: clamp(+dec.buybackPct || 0, 0, G.params.maxBuyback), bids: {} };
    G.segments.forEach(s => {
      const v = +((dec.invest || {})[s.id]);
      if (isFinite(v) && v > 0) out.invest[s.id] = v;
    });
    for (const sid in (dec.divest || {})) {
      const x = dec.divest[sid];
      if (!co.div[sid] || !x || (x.mode !== "liq" && x.mode !== "auction")) continue;
      out.divest[sid] = { mode: x.mode, min: Math.max(0, +x.min || 0) };
      if (x.mode === "liq") delete out.invest[sid];
    }
    for (const sid in (dec.disinvest || {})) {
      const v = +dec.disinvest[sid];
      if (!co.div[sid] || !isFinite(v) || v <= 0 || out.divest[sid] || G.listings.some(l => l.seller === co.id && l.seg === sid)) continue;
      out.disinvest[sid] = Math.min(v, co.div[sid].A);
      delete out.invest[sid];
    }
    if (dec.loan && +dec.loan.amount > 0) out.loan = { amount: +dec.loan.amount, years: clamp(Math.round(+dec.loan.years || 5), 2, G.params.maxLoanYears) };
    for (const lid in (dec.bids || {})) {
      const v = +dec.bids[lid];
      if (isFinite(v) && v > 0 && G.listings.some(l => String(l.id) === String(lid) && l.seller !== co.id)) out.bids[lid] = v;
    }
    return out;
  }

  /* ---------- Simulation d'un exercice ---------- */
  function simulateYear(G, playerDec) {
    if (G.over) return null;
    const t = G.year + 1, p = G.params;
    const R = { t, news: G.news.slice(), ma: [], notes: [], bankrupt: [] };
    const alive = G.companies.filter(c => c.alive);
    const decs = {};
    alive.forEach(co => { decs[co.id] = co.player ? sanitize(G, co, playerDec) : aiDecide(G, co); });
    alive.forEach(co => {
      co._exc = 0; co._cash0 = co.cash; co._loanOut0 = co.loan ? co.loan.out : 0; co._loanRate = co.loan ? co.loan.rate : 0;
      co._inv = 0; co._disinv = 0; co._issue = 0; co._buyback = 0; co._ma = 0; co._sold = {};
    });

    // 1. Résolution des enchères ouvertes l'an dernier
    const open = G.listings; G.listings = [];
    open.forEach(L => {
      const seller = coById(G, L.seller);
      const seg = segById(G, L.seg);
      if (!seller.alive || !seller.div[L.seg]) return;
      const d = seller.div[L.seg];
      let best = null;
      alive.forEach(b => {
        if (b.id === L.seller) return;
        const amt = (decs[b.id].bids || {})[L.id];
        if (!(amt > 0)) return;
        if (amt < L.minPrice) { if (b.player) R.notes.push("Votre offre sur « " + seg.name + " » (" + fmt(amt) + " M€) est inférieure au prix minimal fixé par " + seller.name + "."); return; }
        if (b.cash < amt) { if (b.player) R.notes.push("Offre sur « " + seg.name + " » annulée : trésorerie insuffisante au moment du règlement."); return; }
        const bd = b.div[L.seg];
        if ((bd ? bd.share : 0) + d.share > p.cap) { if (b.player) R.notes.push("L'autorité de la concurrence bloque votre rachat de « " + seg.name + " » : la part cumulée dépasserait " + pct(p.cap) + "."); return; }
        if (!best || amt > best.amt) best = { b, amt };
      });
      if (best) {
        const b = best.b, amt = best.amt;
        seller.cash += amt; seller._exc += amt - d.A; seller._ma += amt; seller._sold[L.seg] = true;
        delete seller.div[L.seg];
        b.cash -= amt; b._ma -= amt;
        const bd = b.div[L.seg];
        if (bd) { bd.K += d.K; bd.A += d.A; bd.X += d.X; bd.share += d.share; }
        else b.div[L.seg] = { K: d.K, A: d.A, X: d.X, share: d.share, rs: d.rs, lossYears: 0, unsold: 0, depT: d.depT, inv: 0, entered: t, hist: [] };
        R.ma.push({ seg: seg.name, seller: seller.name, buyer: b.name, amt, A: d.A, player: seller.player || b.player });
        G.log.push({ t, kind: "cession", text: b.name + " rachète « " + seg.name + " » à " + seller.name + " pour " + fmt(amt) + " M€ (actifs : " + fmt(d.A) + " M€)." });
      } else {
        d.unsold = (d.unsold || 0) + 1;
        R.ma.push({ seg: seg.name, seller: seller.name, buyer: null, amt: 0, A: d.A, player: seller.player });
        if (seller.player) R.notes.push("Aucune offre recevable pour « " + seg.name + " » : la division reste dans le groupe.");
      }
    });

    // 2. Nouvelles cessions
    alive.forEach(co => {
      const dv = decs[co.id].divest || {};
      for (const sid in dv) {
        const d = co.div[sid];
        if (!d) continue;
        const seg = segById(G, sid);
        if (dv[sid].mode === "liq") {
          co.cash += p.recov * d.A; co._exc += (p.recov - 1) * d.A; co._ma += p.recov * d.A; co._sold[sid] = true;
          delete co.div[sid];
          G.log.push({ t, kind: "cession", text: co.name + " ferme sa division « " + seg.name + " » et récupère " + fmt(p.recov * d.A) + " M€." });
          if (co.player) R.notes.push("Division « " + seg.name + " » liquidée : " + fmt(p.recov * d.A) + " M€ récupérés, moins-value de " + fmt((1 - p.recov) * d.A) + " M€.");
        } else {
          G.listings.push({ id: G.nextListingId++, seller: co.id, seg: sid, minPrice: Math.round(dv[sid].min), t });
          G.log.push({ t, kind: "cession", text: co.name + " met en vente sa division « " + seg.name + " » (prix minimal " + fmt(dv[sid].min) + " M€). Offres examinées l'an prochain." });
        }
      }
    });

    // 3. Financement
    alive.forEach(co => {
      const dc = decs[co.id], h = lastH(co);
      const price = h.price;
      if (dc.issuePct > 0 && price > 0) {
        const ns = co.shares * clamp(dc.issuePct, 0, p.maxDil);
        const cash = ns * price * (1 - p.issueDisc);
        co.shares += ns; co.cash += cash; co._issue = cash;
        G.log.push({ t, kind: "bourse", text: co.name + " augmente son capital de " + fmt(cash) + " M€ (+" + pct(dc.issuePct) + " d'actions)." });
      }
      if (dc.buybackPct > 0 && price > 0) {
        let bp = clamp(dc.buybackPct, 0, p.maxBuyback);
        const unit = price * 1.05;
        const maxAff = Math.max(0, co.cash) / (co.shares * unit);
        if (bp > maxAff) { if (co.player) R.notes.push("Rachat d'actions réduit à " + pct(maxAff) + " faute de trésorerie."); bp = maxAff; }
        if (bp > 0.001) {
          const cost = co.shares * bp * unit;
          co.shares -= co.shares * bp; co.cash -= cost; co._buyback = cost;
        }
      }
      if (dc.loan && !co.loan && !co.pendingLoan) {
        const amt = Math.min(dc.loan.amount, maxLoan(G, co));
        if (amt > 0) {
          const n = clamp(dc.loan.years, 2, p.maxLoanYears);
          const rate = loanRate(G, co, amt);
          co.pendingLoan = { P0: amt, out: amt, rate, years: n, left: n, ann: amt / n };
          if (co.player && amt < dc.loan.amount - 0.5) R.notes.push("La banque a plafonné votre emprunt à " + fmt(amt) + " M€.");
        }
      }
      co.payoutUsed = clamp(dc.payout, 0, 1);
      if (co.player) co.payout = co.payoutUsed;
    });

    // 4. Investissements et amortissements
    alive.forEach(co => {
      const dc = decs[co.id];
      G.segments.forEach(seg => {
        let amount = Math.max(0, +(dc.invest[seg.id] || 0));
        let d = co.div[seg.id];
        if (!d && co._sold[seg.id]) {
          if (amount > 0 && co.player) R.notes.push("Investissement prévu dans « " + seg.name + " » annulé : la division a été cédée.");
          return;
        }
        if (!d && amount > 0) {
          d = co.div[seg.id] = { K: 0, A: 0, X: seg.entryX * seg.Xnorm, share: 0, rs: 0, lossYears: 0, unsold: 0, depT: 0, inv: 0, entered: t, hist: [] };
          G.log.push({ t, kind: "entrée", text: co.name + " entre sur « " + seg.name + " » avec " + fmt(amount) + " M€ d'investissement." });
        }
        if (!d) return;
        const dis = Math.min(d.A, Math.max(0, +((dc.disinvest || {})[seg.id] || 0)));
        if (dis > 0 && !G.listings.some(l => l.seller === co.id && l.seg === seg.id)) {
          co.cash += dis; co._disinv += dis; amount = 0;
          if (dis >= d.A - 0.5) {
            co._sold[seg.id] = true;
            delete co.div[seg.id];
            G.log.push({ t, kind: "désinvestissement", text: co.name + " cède la totalité des actifs de « " + seg.name + " » (" + fmt(dis) + " M€) et quitte le créneau." });
            if (co.player) R.notes.push("« " + seg.name + " » : actifs entièrement cédés pour " + fmt(dis) + " M€ ; vous quittez le créneau.");
            return;
          }
          d.A -= dis;
          G.log.push({ t, kind: "désinvestissement", text: co.name + " désinvestit " + fmt(dis) + " M€ d'actifs dans « " + seg.name + " »." });
        }
        const maint = seg.dep * d.A;
        if (co.player && amount > 0) G.pinv.push({ t, sid: seg.id, inv: amount, quad: quadrant(G, seg, d.share > 0 ? d.rs : 0, true), entry: d.entered === t });
        if (d.share >= p.cap && amount > maint) {
          if (co.player) R.notes.push("« " + seg.name + " » : votre part (" + pct(d.share) + ") dépasse le seuil de position dominante ; l'investissement est limité au maintien (" + fmt(maint) + " M€).");
          amount = maint;
        }
        d.depT = seg.dep * d.A;
        d.A = d.A - d.depT + amount;
        d.K = d.A / seg.capex;
        d.inv = amount;
        co._inv += amount;
      });
    });

    // 5. Demande
    G.segments.forEach(seg => {
      const g = pathGrowth(seg.path, t) + seg.gShift + (G.mods.g[seg.id] || 0) + seg.vol * gauss(G);
      seg.g = g;
      seg.D = Math.max(1, seg.D * (1 + g));
    });

    // 6. Marchés
    G.segments.forEach(seg => runMarket(G, seg, t));
    alive.forEach(co => {
      for (const sid in co.div) {
        const d = co.div[sid], seg = segById(G, sid);
        d.X += d.q;
        d.lossYears = d.ebit < 0 ? d.lossYears + 1 : 0;
        d.hist.push(divSnap(d, seg, t));
      }
    });

    // 7. Comptes
    alive.forEach(co => {
      let rev = 0, ebit = 0, dep = 0;
      for (const sid in co.div) { const d = co.div[sid]; rev += d.rev; ebit += d.ebit; dep += d.depT; }
      const interest = co._loanOut0 * co._loanRate + Math.max(0, -co._cash0) * (p.rate + p.odPremium);
      const intInc = Math.max(0, co._cash0) * Math.max(0, p.rate - 0.01);
      const ebt = ebit - interest + intInc;
      const tax = Math.max(0, ebt) * p.tax;
      const npRec = ebt - tax;
      const np = npRec + co._exc;
      const dividends = co.payoutUsed * Math.max(0, npRec);
      let repay = 0;
      if (co.loan) repay = Math.min(co.loan.ann, co.loan.out);
      co.cash = co.cash + npRec + dep - co._inv - dividends - repay;
      if (co.loan) {
        co.loan.out -= repay; co.loan.left -= 1;
        if (co.loan.left <= 0 || co.loan.out < 1e-6) co.loan = null;
      }
      if (co.pendingLoan) {
        co.cash += co.pendingLoan.P0; co.loan = co.pendingLoan; co.pendingLoan = null;
        G.log.push({ t, kind: "banque", text: co.name + " obtient un emprunt de " + fmt(co.loan.P0) + " M€ sur " + co.loan.years + " ans à " + pct(co.loan.rate, 2) + "." });
      }
      const val = valuation(G, co, npRec);
      let price = val.value / co.shares;
      const dps = dividends / co.shares;
      co.dps.push(dps);
      let score = price + sum(co.dps) / co.dps.length;
      co.overdraft = p.overdraft * Math.max(rev, 0.5 * co.hist[0].rev);
      if (co.cash < -co.overdraft) {
        co.alive = false; co.bankrupt = t; price = 0; score = 0;
        R.bankrupt.push(co.name);
        G.log.push({ t, kind: "faillite", text: co.name + " dépasse son autorisation de découvert : cessation de paiements, la société est placée en liquidation." });
        if (co.player) { G.over = true; G.bankrupt = true; }
      }
      co.hist.push({
        t, rev, ebit, dep, interest, intInc, tax, npRec, exc: co._exc, np, dividends, inv: co._inv,
        disinv: co._disinv, cash: co.cash, debt: val.debt, equity: val.equity, assets: val.assets, value: co.alive ? val.value : 0, PER: val.PER,
        price, dps, score, shares: co.shares, issue: co._issue, buyback: co._buyback, ma: co._ma, payout: co.payoutUsed, repay
      });
    });
    // sociétés en faillite : capacités retirées du marché
    G.companies.forEach(co => {
      if (!co.alive && co.bankrupt === t) {
        co.div = {};
        G.listings = G.listings.filter(l => l.seller !== co.id);
      }
    });
    alive.forEach(co => { delete co._sold; });

    // 8. Banque centrale
    if (rnd(G) < 0.3) G.params.rate = clamp(G.params.rate + (rnd(G) < 0.5 ? -0.005 : 0.005), 0.005, 0.09);

    G.year = t;
    R.ranking = ranking(G);
    G.results.push({ t, notes: R.notes, ma: R.ma, bankrupt: R.bankrupt });
    if (t >= G.T) G.over = true;
    if (!G.over) genNews(G, t + 1);
    return R;
  }

  function quadrant(G, seg, rs, forecast) {
    const g = forecast ? forecastGrowth(G, seg, G.year + 1) : seg.g;
    const hi = g >= G.params.bcgG;
    if (rs >= 1) return hi ? "vedette" : "vache";
    return hi ? "dilemme" : "poids";
  }

  function ranking(G) {
    return G.companies.map(c => ({ id: c.id, name: c.name, player: c.player, score: lastH(c).score, alive: c.alive }))
      .sort((a, b) => b.score - a.score);
  }

  /* ---------- Formats ---------- */
  function fmt(x, dec) {
    if (!isFinite(x)) return "—";
    return x.toLocaleString("fr-FR", { maximumFractionDigits: dec || 0, minimumFractionDigits: dec || 0 });
  }
  function pct(x, dec) {
    if (!isFinite(x)) return "—";
    return (x * 100).toLocaleString("fr-FR", { maximumFractionDigits: dec == null ? 1 : dec, minimumFractionDigits: dec == null ? 0 : dec }) + " %";
  }

  return {
    SCENARIOS, PERSONAS, newGame, simulateYear, defaultDecision, investHints, maxLoan, loanRate, loanTotal,
    forecastGrowth, quadrant, segPER, segById, coById, lastH, valuation, pathGrowth, unitCost, fmt, pct, clamp, sum, sanitize
  };
})();

<script>
"use strict";
(function () {
  const E = ENGINE;
  const fmt = E.fmt, pct = E.pct, clamp = E.clamp;
  const app = document.getElementById("app");
  const SAVE_KEY = "leconseil.partie.v1";
  const SHORT = { emb: "Emballages", mac: "Machines-outils", cmp: "Composants", bat: "Batteries", pmt: "Pièces thermiques", cap: "Capteurs", med: "Médical",
    gvfr: "GV France", gvde: "GV Allemagne", gves: "GV Espagne", gvit: "GV Italie", icfr: "IC France", icde: "IC Allemagne", icsud: "IC Sud", car: "Autocars",
    mfr: "Meubles FR", mde: "Meubles DACH", msud: "Meubles Sud", muk: "Meubles UK", co2: "Centrales CO₂", hfc: "Vitrines HFC", srv: "Services", chf: "Chambres froides" };
  const QUAD = { vedette: "Vedette", vache: "Vache à lait", dilemme: "Dilemme", poids: "Poids mort" };
  const TABS = [
    ["conseil", "Séance du conseil"], ["divisions", "Divisions"], ["marches", "Marchés"], ["matrice", "Matrice BCG"],
    ["comptes", "Comptes"], ["rivaux", "Concurrents"], ["journal", "Journal"], ["regles", "Règles"]
  ];

  const S = {
    G: null, draft: null, q: {}, tab: "conseil", result: null, matrixCo: "P", confirmRisk: false,
    sel: { scenario: "industrie", years: 15, timer: 0, name: "", seed: "" }, deadline: 0
  };

  /* ---------------- utilitaires ---------------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const M = x => fmt(x) + " M€";
  const EUR = x => fmt(x, 2) + " €";
  const sign = (x, f) => (x > 0 ? "+" : x < 0 ? "−" : "") + f(Math.abs(x));
  const player = () => S.G.companies.find(c => c.player);
  const yearOf = t => S.G.startYear + t - 1;
  const lastH = E.lastH;
  const segOf = id => E.segById(S.G, id);
  function rankOf(co) {
    const r = S.G.companies.map(c => ({ c, s: lastH(c).score })).sort((a, b) => b.s - a.s);
    return r.findIndex(x => x.c === co) + 1;
  }
  function quadOf(co, sid) {
    const d = co.div[sid];
    return E.quadrant(S.G, segOf(sid), d && d.share > 0 ? d.rs : 0, true);
  }
  function sdFlag(r) {
    if (r > 1.06) return '<span class="sd-flag sd-over">surcapacité</span>';
    if (r < 0.95) return '<span class="sd-flag sd-under">pénurie</span>';
    return '<span class="sd-flag sd-eq">équilibre</span>';
  }

  /* ---------------- sauvegarde ---------------- */
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ G: S.G, draft: S.draft, q: S.q, sel: S.sel })); } catch (e) { /* stockage indisponible */ }
  }
  function loadSaved() {
    try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function clearSaved() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* rien */ } }

  /* ---------------- brouillon de décisions ---------------- */
  function freshDraft() {
    const co = player();
    const d = E.defaultDecision(S.G, co);
    d.loan = null; d.issuePct = 0; d.buybackPct = 0; d.bids = {}; d.disinvest = {};
    S.q = {};
    for (const sid in co.div) S.q[sid] = "maint";
    S.confirmRisk = false;
    return d;
  }

  function hasListing(co, sid) { return S.G.listings.some(l => l.seller === co.id && l.seg === sid); }

  function estimate() {
    const G = S.G, co = player(), h = lastH(co), d = S.draft, p = G.params;
    let cash = co.cash, inv = 0, dep = 0, liq = 0, bids = 0;
    for (const sid in d.invest) inv += +d.invest[sid] || 0;
    for (const sid in co.div) {
      const dv = d.divest[sid];
      if (dv && dv.mode === "liq") liq += p.recov * co.div[sid].A;
    }
    for (const lid in d.bids) bids += +d.bids[lid] || 0;
    let dis = 0;
    for (const sid in (d.disinvest || {})) if (co.div[sid]) dis += Math.min(+d.disinvest[sid] || 0, co.div[sid].A);
    const issue = d.issuePct > 0 ? co.shares * d.issuePct * h.price * (1 - p.issueDisc) : 0;
    const buy = d.buybackPct > 0 ? co.shares * d.buybackPct * h.price * 1.05 : 0;
    const divEst = d.payout * Math.max(0, h.npRec);
    const repay = co.loan ? Math.min(co.loan.ann, co.loan.out) : 0;
    cash += issue - buy - bids + liq + dis + h.npRec + h.dep - inv - divEst - repay;
    const ml = E.maxLoan(G, co);
    const loanIn = d.loan ? Math.min(+d.loan.amount || 0, ml) : 0;
    const end = cash + loanIn;
    const limit = p.overdraft * Math.max(h.rev, 0.5 * co.hist[0].rev);
    const lvl = end < -limit ? "bad" : end < 0 ? "warn" : "good";
    return { inv, dis, end, limit, lvl, divEst, issue, buy, loanIn, ml };
  }

  /* ---------------- graphiques SVG ---------------- */
  function niceTicks(min, max, n) {
    if (!isFinite(min) || !isFinite(max)) return [0, 1];
    if (min === max) { max = min + 1; min = min - 1; }
    const span = max - min, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => span / s <= n) || 10 * mag;
    const t = [];
    for (let v = Math.floor(min / step) * step; v <= max + step * 0.001; v += step) t.push(+v.toFixed(10));
    if (t[t.length - 1] < max) t.push(t[t.length - 1] + step);
    return t;
  }
  function lineChart(series, o) {
    o = o || {};
    const W = o.w || 640, H = o.h || 220, ml = o.ml || 46, mr = 70, mt = 12, mb = 26;
    const all = series.flatMap(s => s.pts);
    if (!all.length) return "";
    const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    let yt = niceTicks(o.y0 != null ? Math.min(o.y0, ...ys) : Math.min(...ys), Math.max(...ys), 4);
    const y0 = yt[0], y1 = yt[yt.length - 1];
    const X = x => ml + (x1 === x0 ? 0.5 : (x - x0) / (x1 - x0)) * (W - ml - mr);
    const Y = y => mt + (1 - (y - y0) / (y1 - y0 || 1)) * (H - mt - mb);
    let g = "";
    yt.forEach(v => { g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${ml - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11">${esc(o.fy ? o.fy(v) : fmt(v, Math.abs(y1 - y0) < 5 ? 1 : 0))}</text>`; });
    const xstep = Math.max(1, Math.ceil((x1 - x0) / 8));
    for (let x = x0; x <= x1; x += xstep) g += `<text x="${X(x)}" y="${H - 8}" text-anchor="middle" font-size="11">${esc(o.fx ? o.fx(x) : x)}</text>`;
    const ends = [];
    series.forEach(s => {
      if (!s.pts.length) return;
      const d = s.pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2}" ${s.dash ? 'stroke-dasharray="4 4"' : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
      const lp = s.pts[s.pts.length - 1];
      g += `<circle cx="${X(lp[0])}" cy="${Y(lp[1])}" r="${s.w > 2 ? 4 : 3}" fill="${s.color}"/>`;
      ends.push({ y: Y(lp[1]), x: X(lp[0]), label: s.label || "", color: s.color });
    });
    ends.sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
    ends.forEach(e => { if (e.label) g += `<text x="${e.x + 7}" y="${Math.min(H - mb, e.y) + 4}" font-size="11" style="fill:${e.color}">${esc(e.label)}</text>`; });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "Graphique")}">${g}</svg>`;
  }
  function spark(vals, color) {
    if (vals.length < 2) return "";
    const W = 84, H = 24, mn = Math.min(...vals), mx = Math.max(...vals), sp = mx - mn || 1;
    const pts = vals.map((v, i) => [(i / (vals.length - 1)) * (W - 4) + 2, H - 3 - ((v - mn) / sp) * (H - 6)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
    const l = pts[pts.length - 1];
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" style="vertical-align:middle"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/><circle cx="${l[0]}" cy="${l[1]}" r="2.4" fill="${color}"/></svg>`;
  }

  function bcgChart(co) {
    const G = S.G, W = 640, H = 430, ml = 50, mr = 16, mt = 16, mb = 44;
    const items = [];
    for (const sid in co.div) {
      const d = co.div[sid], seg = segOf(sid);
      items.push({ seg, d, rs: clamp(d.share > 0 ? d.rs : 0.1, 0.1, 10), g: seg.g, rev: d.rev || 0 });
    }
    const gs = G.segments.map(s => s.g).concat([G.params.bcgG]);
    let gmin = Math.min(-0.05, ...gs) - 0.02, gmax = Math.max(0.15, ...gs) + 0.02;
    const yt = niceTicks(gmin * 100, gmax * 100, 6);
    gmin = yt[0] / 100; gmax = yt[yt.length - 1] / 100;
    const lx = v => Math.log10(v);
    const X = rs => ml + (1 - (lx(rs) + 1) / 2) * (W - ml - mr);
    const Y = g => mt + (1 - (g - gmin) / (gmax - gmin)) * (H - mt - mb);
    const maxRev = Math.max(1, ...G.companies.flatMap(c => Object.values(c.div).map(d => d.rev || 0)));
    let s = "";
    s += `<rect x="${ml}" y="${mt}" width="${X(1) - ml}" height="${Y(G.params.bcgG) - mt}" fill="var(--good)" opacity="0.06"/>`;
    s += `<rect x="${X(1)}" y="${Y(G.params.bcgG)}" width="${W - mr - X(1)}" height="${H - mb - Y(G.params.bcgG)}" fill="var(--bad)" opacity="0.06"/>`;
    yt.forEach(v => { s += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v / 100)}" y2="${Y(v / 100)}" stroke="var(--line)"/><text x="${ml - 6}" y="${Y(v / 100) + 4}" text-anchor="end" font-size="11">${fmt(v)} %</text>`; });
    [10, 5, 2, 1, 0.5, 0.2, 0.1].forEach(v => { s += `<line x1="${X(v)}" x2="${X(v)}" y1="${mt}" y2="${H - mb}" stroke="var(--line)" stroke-dasharray="${v === 1 ? "0" : "2 3"}"/><text x="${X(v)}" y="${H - mb + 15}" text-anchor="middle" font-size="11">${fmt(v, v < 1 ? 1 : 0)}×</text>`; });
    s += `<line x1="${X(1)}" x2="${X(1)}" y1="${mt}" y2="${H - mb}" stroke="var(--ink)" stroke-width="1.2"/>`;
    s += `<line x1="${ml}" x2="${W - mr}" y1="${Y(G.params.bcgG)}" y2="${Y(G.params.bcgG)}" stroke="var(--ink)" stroke-width="1.2"/>`;
    s += `<text x="${W / 2}" y="${H - 6}" text-anchor="middle" font-size="11">Part de marché relative (échelle log, leader à gauche)</text>`;
    const ql = (x, y, t, a) => `<text x="${x}" y="${y}" text-anchor="${a}" font-size="12" font-weight="700" style="fill:var(--muted);letter-spacing:.08em">${t}</text>`;
    s += ql(ml + 8, mt + 16, "VEDETTES", "start") + ql(W - mr - 8, mt + 16, "DILEMMES", "end") + ql(ml + 8, H - mb - 8, "VACHES À LAIT", "start") + ql(W - mr - 8, H - mb - 8, "POIDS MORTS", "end");
    const boxes = [[ml + 4, mt + 2, ml + 110, mt + 22], [W - mr - 100, mt + 2, W - mr - 4, mt + 22], [ml + 4, H - mb - 22, ml + 130, H - mb - 2], [W - mr - 110, H - mb - 22, W - mr - 4, H - mb - 2]];
    const hit = b => boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
    const circles = [], labels = [];
    items.sort((a, b) => b.rev - a.rev).forEach(it => {
      const r = 6 + 30 * Math.sqrt(it.rev / maxRev);
      const cx = X(it.rs), cy = clamp(Y(it.g), mt, H - mb);
      circles.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${co.color}" fill-opacity="0.28" stroke="${co.color}" stroke-width="1.6"/>`);
      boxes.push([cx - r * 0.7, cy - r * 0.7, cx + r * 0.7, cy + r * 0.7]);
      it.cx = cx; it.cy = cy; it.r = r;
    });
    items.forEach(it => {
      const txt = SHORT[it.seg.id] || it.seg.name, w = txt.length * 6.4 + 4, hgt = 14;
      const cands = [[0, -it.r - 6], [0, it.r + 15], [it.r + 4 + w / 2, 4], [-it.r - 4 - w / 2, 4], [0, -it.r - 20], [0, it.r + 29]];
      let pos = cands[0];
      for (const c of cands) {
        const x = clamp(it.cx + c[0], ml + w / 2, W - mr - w / 2), y = it.cy + c[1];
        const b = [x - w / 2, y - hgt + 3, x + w / 2, y + 3];
        if (!hit(b) && y > mt + 10 && y < H - mb) { pos = [x - it.cx, c[1]]; break; }
      }
      const x = clamp(it.cx + pos[0], ml + w / 2, W - mr - w / 2), y = it.cy + pos[1];
      boxes.push([x - w / 2, y - hgt + 3, x + w / 2, y + 3]);
      labels.push(`<text x="${x}" y="${y}" text-anchor="middle" font-size="11" style="fill:var(--ink)">${esc(txt)}</text>`);
    });
    s += circles.join("") + labels.join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Matrice part de marché relative et croissance de ${esc(co.name)}">${s}</svg>`;
  }

  /* ---------------- guilloche ---------------- */
  function drawGuilloche() {
    const cv = document.getElementById("guill");
    if (!cv) return;
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);
    const col = getComputedStyle(document.documentElement).getPropertyValue("--brass").trim() || "#8C6E22";
    ctx.strokeStyle = col; ctx.lineWidth = 0.6; ctx.globalAlpha = 0.5;
    const cx = r.width - Math.min(170, r.width * 0.22), cy = r.height / 2;
    const Rb = Math.min(150, r.height * 0.62);
    for (let k = 0; k < 3; k++) {
      const R = Rb - k * 26, rr = 13 + k * 4, d = 24 - k * 5, n = 2600;
      ctx.beginPath();
      for (let i = 0; i <= n; i++) {
        const t = (i / n) * Math.PI * 2 * rr;
        const x = cx + (R - rr) * Math.cos(t) + d * Math.cos(((R - rr) / rr) * t);
        const y = cy + (R - rr) * Math.sin(t) - d * Math.sin(((R - rr) / rr) * t);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 0.25;
    for (let j = 0; j < 7; j++) {
      ctx.beginPath();
      for (let x = 0; x <= r.width; x += 3) {
        const y = 10 + j * 5 + 4 * Math.sin(x / 19 + j * 0.9);
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
  }

  /* ================================================================
     ACCUEIL
     ================================================================ */
  function renderHome() {
    const saved = loadSaved();
    const sc = E.SCENARIOS;
    app.innerHTML = `
<header class="cert"><canvas id="guill"></canvas><div class="wrap"><div class="frame">
  <div class="serial"><span>Société anonyme à conseil d'administration</span><span>Valeur de départ 10,00 € par action</span></div>

    <div class="scen-grid">${sc.map(s => `

        <span class="eyebrow">${esc(s.kicker)}</span>

  <section class="section">

      <div class="field"><label for="o-years">Durée du mandat</label><select id="o-years" data-o="years">${[10, 15, 20].map(y => `<option value="${y}" ${S.sel.years === y ? "selected" : ""}>${y} exercices</option>`).join("")}</select></div>
      <div class="field"><label for="o-timer">Temps par exercice</label><select id="o-timer" data-o="timer">${[[0, "Illimité"], [180, "3 minutes"], [300, "5 minutes"]].map(([v, l]) => `<option value="${v}" ${S.sel.timer === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label for="o-name">Nom de votre société</label><input id="o-name" type="text" data-o="name" maxlength="32" placeholder="${esc(sc.find(s => s.id === S.sel.scenario).companies[0].name)}" value="${esc(S.sel.name)}"></div>
